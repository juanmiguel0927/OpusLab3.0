<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpusLab 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        const tools = {
            'serie-armonica': {
                title: 'Serie Armónica',
                iconHtml: '<i class="fa-solid fa-wave-square mr-2 text-blue-400"></i>',
                url: 'https://juanmiguel0927.github.io/SerieArmonica/'
            },
            'drops': {
                title: 'Drops',
                iconHtml: '<i class="fa-solid fa-music mr-2 text-blue-400"></i>',
                url: 'https://juanmiguel0927.github.io/Drops/'
            },
            'armaduras': {
                title: 'Armaduras',
                iconHtml: '<span class="font-serif text-xl tracking-tighter mr-2 text-blue-400">𝄞𝄢</span>',
                url: 'https://juanmiguel0927.github.io/Armaduras/'
            },
            'aprox-leadsheet': {
                title: 'Aprox. Lead Sheet',
                iconHtml: '<i class="fa-solid fa-file-lines mr-2 text-blue-400"></i>',
                url: 'https://juanmiguel0927.github.io/AproxLeadSheet/'
            }
        };

        let currentTabId = 'serie-armonica';

        function showLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function switchTab(tabId, buttonElement) {
            if (currentTabId === tabId) return;

            // 1. Update Navigation Styles
            const allButtons = document.querySelectorAll('.tab-button');
            allButtons.forEach(btn => {
                btn.classList.remove('active', 'border-blue-500', 'text-blue-400');
                btn.classList.add('border-transparent', 'text-slate-300');
                // Reset background on active state change
                btn.style.background = ''; 
            });

            buttonElement.classList.remove('border-transparent', 'text-slate-300');
            buttonElement.classList.add('active', 'border-blue-500', 'text-blue-400');

            // 2. Hide all tabs and prepare to show the new one
            Object.keys(tools).forEach(id => {
                const el = document.getElementById(`tab-${id}`);
                if (el) {
                    el.classList.add('hidden');
                    el.classList.remove('fade-in');
                }
            });

            // 3. Update Header
            const tool = tools[tabId];
            document.getElementById('current-tool-title').innerHTML = `${tool.iconHtml} ${tool.title}`;

            // 4. Show the selected tab
            const tabContainer = document.getElementById(`tab-${tabId}`);
            const iframe = tabContainer.querySelector('iframe');
            
            // Lazy load the iframe if it hasn't been loaded yet
            if (iframe.getAttribute('data-src')) {
                showLoading();
                iframe.src = iframe.getAttribute('data-src');
                iframe.removeAttribute('data-src'); // Prevent reloading next time
            }
            
            tabContainer.classList.remove('hidden');
            // Force a reflow to restart the animation
            void tabContainer.offsetWidth; 
            tabContainer.classList.add('fade-in');
            
            currentTabId = tabId;
        }

        function reloadCurrentTab() {
            showLoading();
            const tabContainer = document.getElementById(`tab-${currentTabId}`);
            const iframe = tabContainer.querySelector('iframe');
            // Force reload by setting src to itself
            const currentSrc = iframe.src;
            iframe.src = '';
            setTimeout(() => {
                iframe.src = currentSrc;
            }, 50);
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Slate 900 for a deep, modern tech look */
            color: #e2e8f0; /* Slate 200 for text */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scroll, let content area scroll */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; /* Slate 800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; /* Slate 600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* Slate 500 */
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Changed from right to bottom border */
        }

        .tab-button {
            transition: all 0.3s ease;
        }
        .tab-button.active {
            background: rgba(59, 130, 246, 0.15); /* Blue 500 subtle background */
            border-bottom-color: #3b82f6; /* Blue 500 border bottom for horizontal layout */
            color: #60a5fa; /* Blue 400 text */
        }
        .tab-button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Iframe container styling */
        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white; /* Ensure iframes have white background if they are transparent */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="glass-panel flex-shrink-0 z-20 flex flex-col sm:flex-row items-center justify-between px-6 py-3">
        <!-- Logo Area -->
        <div class="flex items-center gap-3 mb-3 sm:mb-0">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-flask text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">OpusLab <span class="text-blue-400">3.0</span></h1>
                <p class="text-xs text-slate-400">Entorno de Herramientas</p>
            </div>
        </div>

        <!-- Navigation Tabs (Horizontal) -->
        <nav class="flex overflow-x-auto space-x-2 pb-1 sm:pb-0 w-full sm:w-auto hide-scrollbar">
            <button onclick="switchTab('serie-armonica', this)" class="tab-button active flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-t-lg border-b-2 border-blue-500 text-blue-400 whitespace-nowrap">
                <i class="fa-solid fa-wave-square"></i>
                <span class="font-medium">Serie Armónica</span>
            </button>
            
            <button onclick="switchTab('drops', this)" class="tab-button flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-300 whitespace-nowrap">
                <i class="fa-solid fa-music"></i>
                <span class="font-medium">Drops</span>
            </button>
            
            <button onclick="switchTab('armaduras', this)" class="tab-button flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-300 whitespace-nowrap">
                <span class="font-serif text-lg leading-none tracking-tighter pt-0.5">𝄞𝄢</span>
                <span class="font-medium">Armaduras</span>
            </button>
            
            <button onclick="switchTab('aprox-leadsheet', this)" class="tab-button flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-300 whitespace-nowrap">
                <i class="fa-solid fa-file-lines"></i>
                <span class="font-medium">Aprox. Lead Sheet</span>
            </button>
        </nav>
        
        <!-- Controls (Hidden on very small screens, visible on md and up) -->
        <div class="hidden md:flex items-center gap-2 ml-4">
             <button class="text-slate-400 hover:text-white transition-colors p-2 rounded-full hover:bg-slate-700" title="Recargar herramienta" onclick="reloadCurrentTab()">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 relative">
        
        <!-- Tool Title Bar (Optional, might be redundant with tabs, but kept for clarity on mobile) -->
        <div class="h-10 flex items-center px-6 border-b border-slate-800 bg-slate-900/50 sm:hidden">
             <h2 id="current-tool-title" class="text-sm font-semibold text-slate-300">
                <i class="fa-solid fa-wave-square mr-2 text-blue-400"></i> Serie Armónica
            </h2>
        </div>

        <!-- Content Container -->
        <div class="flex-1 overflow-hidden relative">
            
            <!-- Loading Indicator Overlay -->
            <div id="loading-overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm hidden">
                <div class="w-12 h-12 border-4 border-slate-600 border-t-blue-500 rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-300 font-medium">Cargando herramienta...</p>
            </div>

            <!-- Iframes (Pre-loaded for faster switching) -->
            <div id="tab-serie-armonica" class="w-full h-full fade-in">
                <iframe src="https://juanmiguel0927.github.io/SerieArmonica/" class="iframe-container !rounded-none shadow-none" title="Serie Armónica" onload="hideLoading()"></iframe>
            </div>

            <div id="tab-drops" class="w-full h-full hidden">
                <!-- Using data-src to lazy load when tab is clicked for the first time -->
                <iframe data-src="https://juanmiguel0927.github.io/Drops/" class="iframe-container !rounded-none shadow-none" title="Drops" onload="hideLoading()"></iframe>
            </div>

            <div id="tab-armaduras" class="w-full h-full hidden">
                <iframe data-src="https://juanmiguel0927.github.io/Armaduras/" class="iframe-container !rounded-none shadow-none" title="Armaduras" onload="hideLoading()"></iframe>
            </div>

            <div id="tab-aprox-leadsheet" class="w-full h-full hidden">
                <iframe data-src="https://juanmiguel0927.github.io/AproxLeadSheet/" class="iframe-container !rounded-none shadow-none" title="Aproximación al Lead Sheet" onload="hideLoading()"></iframe>
            </div>
        </div>
    </main>

    <!-- Footer for Credits -->
    <footer class="glass-panel py-2 px-4 text-center border-t border-slate-700/50 z-20">
        <p class="text-xs text-slate-400">
            Creado por <span class="font-semibold text-slate-300">Juan Miguel Rios Redondo</span>
        </p>
    </footer>

    <!-- Style to hide scrollbar on the nav if it overflows on mobile -->
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>
</html>
